services:
  - type: web
    name: votaciones-app
    runtime: node
    plan: free

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # (Opcional) CORS_ORIGIN si lo usas
      # - key: CORS_ORIGIN
      #   value: https://tu-dominio.render.com

    buildCommand: |
      set -e
      # --- Backend ---
      cd server
      npm ci --include=dev          # instala devDependencies (typescript, @types, prisma)
      npm run build                 # tsc -p . && prisma generate
      cd ..

      # --- Frontend (Vite) ---
      cd Cliente
      npm ci --include=dev          # instala devDependencies (vite, @types/node, etc.)
      npm run build                 # genera /Cliente/dist
      cd ..

      # --- Empaquetar front dentro del backend compilado ---
      mkdir -p server/dist/public
      cp -r Cliente/dist/* server/dist/public/

    # Producción SOLO en runtime
    startCommand: NODE_ENV=production node server/dist/server.js

    buildFilter:
      paths:
        - Cliente/**
        - server/**
